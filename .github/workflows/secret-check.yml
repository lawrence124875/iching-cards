name: secret-check
on:
  push:
    paths: ['.github/workflows/secret-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Secret 是否存在
        env:
          T: ${{ secrets.BUILDS_REPO_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "RESULT: BUILDS_REPO_TOKEN 未設定"; exit 1; fi
          echo "RESULT: Secret 存在"
      - name: 讀取私人 repo（checkout）
        uses: actions/checkout@v4
        with:
          repository: lawrence124875/iching-content
          token: ${{ secrets.BUILDS_REPO_TOKEN }}
          path: content
      - name: 確認讀取成功（只計數，不列出內容）
        run: echo "RESULT: 讀取成功，檔案數 $(find content -type f -not -path '*/.git/*' | wc -l)"
      - name: 測試建立並刪除 Release（寫入權限）
        env:
          GH_TOKEN: ${{ secrets.BUILDS_REPO_TOKEN }}
        run: |
          TAG="secret-check-run${{ github.run_number }}"
          echo "test" > check.txt
          gh release create "$TAG" check.txt --repo lawrence124875/iching-content --title "$TAG" --notes "權限測試，將立即刪除"
          echo "RESULT: Release 建立成功"
          gh release delete "$TAG" --repo lawrence124875/iching-content --yes --cleanup-tag
          echo "RESULT: Release 刪除成功"
